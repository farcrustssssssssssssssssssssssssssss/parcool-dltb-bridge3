plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2]'
}

repositories {
    // ParCool is taken from Modrinth Maven (same source ParCool itself documents for addon developers)
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Stamina [DLTB] jar is kept in ./libs (compile-time only, it is NOT bundled into the bridge)
    flatDir { dir 'libs' }
}

compileJava.options.encoding = 'UTF-8'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

version = mod_version
group = 'dev.parcooldltb'

base {
    archivesName = 'parcool-dltb-bridge'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("maven.modrinth:Fsvx2bdR:${parcool_version}")
    compileOnly fg.deobf(":ktstamina:1.0.0")
}

processResources {
    var props = [
            mod_id     : mod_id,
            mod_version: mod_version
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) {
        expand props
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "ParCool x Stamina DLTB Bridge",
                "Specification-Version"   : "${mod_version}",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${mod_version}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy('reobfJar')
}
