modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "ParCool x Stamina [DLTB] Bridge"
authors = "bridge"
description = '''
Makes ParCool use the stamina bar of Stamina [DLTB] instead of its own.
Select it in parcool-server.toml:  stamina_type = "parcooldltb:dltb"
'''

[[dependencies.parcooldltb]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.parcooldltb]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

# ParCool fires RegisterParCoolStaminaTypeEvent inside its own constructor,
# so this mod must be constructed BEFORE ParCool.
[[dependencies.parcooldltb]]
modId = "parcool"
mandatory = true
versionRange = "[4.0.0.0,)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies.parcooldltb]]
modId = "ktstanima"
mandatory = true
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"
